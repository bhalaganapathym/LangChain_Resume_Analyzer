<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        textarea { width: 100%; height: 150px; margin-bottom: 15px; padding: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Hey There !!!</h1>
    <form action="/send" method="post">
        <label for="resume"><strong>Paste your Resume:</strong></label><br>
        <textarea name="resume" id="resume" placeholder="Paste full resume text here..." required></textarea> <br>
        
        <label for="jd"><strong>Enter your Job Description:</strong></label><br>
        <textarea name="jd" id="jd" placeholder="Paste job description here..." required></textarea> <br>
        
        <button type="submit">Analyze Resume</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
